dataset:
  name: Buchwald_sub4
  feature_columns:
    - Product
    - Reactant2
    - Ligand
    - Additive
    - Base
  target_column: Yield
  task_column: Product
  target_task_value: N-(4-ethylphenyl)-4-methylaniline
  condition_roles:
    - Reactant2
    - Ligand
    - Additive
    - Base
  derived_roles: {}
  budget: 40
  seeds: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000]

features:
  identity_scale: 1.0
  rule_scale: 0.75
  molecular_scale: 0.35
  registry_path: null
  use_name_rules: true
  use_rdkit: true
  morgan_radius: 2
  morgan_bits: 256
  missing_registry_policy: warn

gp:
  interaction_pairs:
    - [Reactant2, Ligand]
    - [Reactant2, Additive]
    - [Ligand, Additive]
    - [Ligand, Base]
    - [Additive, Base]
  role_weights:
    Reactant2: 1.25
    Ligand: 1.0
    Additive: 1.25
    Base: 0.9
  interaction_weights:
    "Reactant2|Ligand": 1.0
    "Reactant2|Additive": 1.0
    "Ligand|Additive": 0.8
    "Ligand|Base": 0.8
    "Additive|Base": 0.6
  optimize_hyperparameters: true
  restarts: 3
  maxiter: 140
  refit_interval: 2
  initial_lengthscale: 1.0
  initial_noise: 0.05
  initial_pair_scale: 0.20
  initial_task_rho: 0.50
  jitter: 1.0e-8
  target_transform: standard

interaction_model:
  interaction_pairs:
    - [Reactant2, Ligand]
    - [Reactant2, Additive]
    - [Ligand, Additive]
    - [Ligand, Base]
    - [Additive, Base]
  role_ranks:
    Product: 2
    Reactant2: 2
    Ligand: 3
    Additive: 5
    Base: 2
  default_rank: 4
  interaction_scale: 0.40
  alpha_1: 1.0e-6
  alpha_2: 1.0e-6
  lambda_1: 1.0e-6
  lambda_2: 1.0e-6
  target_transform: standard

trees:
  n_estimators: 320
  max_features: sqrt
  min_samples_leaf: 2
  max_depth: null
  residual_noise_fraction: 0.35
  target_transform: standard

ensemble:
  enabled_models: [gp, interaction, trees]
  initial_weights:
    gp: 0.50
    interaction: 0.30
    trees: 0.20
  prequential_learning_rate: 0.15
  minimum_weight: 0.08
  predictive_std_floor: 2.0

policy:
  first_query: posterior_mean
  early_end: 20
  final_start: 33
  challenge_every: 5
  challenge_beta: 1.5
  challenge_disagreement_weight: 0.75
  challenge_gate_sigma: 1.0
  final_beta: 0.15
  xi_initial: 0.05
  xi_final: 0.0
  prior_initial_weight: 0.0
  prior_decay: 0.30

runtime:
  backend: native
  output_dir: runs/buchwald_sub4
  save_candidate_scores: false
  strict_reproducibility: true
