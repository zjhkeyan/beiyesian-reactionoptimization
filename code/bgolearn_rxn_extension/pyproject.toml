[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgolearn-rxn"
version = "0.1.0"
description = "Best-practice reaction-condition optimization extensions for Bgolearn"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Reference implementation generated for the reaction-optimization benchmark"}
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
bgolearn = ["Bgolearn==3.1.0"]
chem = ["rdkit>=2024.3"]
submission = ["torch>=2.2"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]
all = [
  "Bgolearn==3.1.0",
  "rdkit>=2024.3",
  "torch>=2.2",
]

[project.scripts]
bgolearn-rxn = "bgolearn_rxn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
